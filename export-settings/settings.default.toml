# Configurações padrão — NÃO EDITE ESTE ARQUIVO
# Este arquivo é a referência de valores originais.
# Para restaurar o settings.toml após edições: cp settings.default.toml settings.toml

[font]
family      = "Whitman"
path        = "/usr/local/share/fonts/w/"
upright     = "Whitman_RomanOsF"
italic      = "Whitman_ItalicOsF"
bold        = "Whitman_BoldOsF"
bold_italic = "Whitman_ItalicOsF"
extension   = ".ttf"
size_pt     = 13       # tamanho do corpo de texto em pt
leading_pt  = 16.9     # espaçamento entre linhas (1.3× o tamanho é um bom valor)

[page]
width_cm         = 16    # largura do papel
height_cm        = 23    # altura do papel
margin_top_cm    = 1.5
margin_bottom_cm = 1.5
margin_inner_cm  = 2.0   # margem interna (lombada)
margin_outer_cm  = 1.5   # margem externa

[content]
include_front_matter = true   # false → ignora tudo em Front-matter/ (só os contos)
language             = "pt-BR"
paragraph_indent_cm  = 1.0
toc_depth            = 0      # 0 = só capítulos, 1 = capítulos + subcapítulos
